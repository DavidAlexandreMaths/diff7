<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LEGO Gears</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #202020;
      color: white;
      font-family: Arial;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 10px;
    }

    input {
      width: 200px;
    }
  </style>
</head>
<body>

<div id="ui">
  <div>
    Tours :
    <input type="range" id="turnSlider"
           min="0" max="20" step="0.1" value="0">
  </div>

  <br>

  <div id="counter1">
    Première roue : 0
  </div>

  <div id="counter2">
    Dernière roue : 0
  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
